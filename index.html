<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed"><title>PinPilot — Pinterest Affiliate Content Assistant</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#1f1f2e;--muted:#6d6d80;--line:#e7e4ef;--accent:#7c3aed;--accent2:#ede9fe;--good:#15803d;--warn:#b45309;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700}button.secondary{background:#f1eff8;color:var(--ink)}button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}button.danger{background:#fee2e2;color:#991b1b}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:18px}.nav button{white-space:nowrap;background:transparent;color:var(--muted);border:1px solid var(--line)}.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 18px #33215b08}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.h{display:flex;justify-content:space-between;gap:12px;align-items:center}.h h2,.h h3{margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:13px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:800;font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}textarea{min-height:92px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--accent2);color:#5b21b6;font-size:12px;font-weight:800}.score{font-size:25px;font-weight:900;color:var(--accent)}.output{border:1px dashed #c4b5fd;background:#faf8ff;border-radius:14px;padding:13px;margin-top:12px}.output h4{margin:0 0 7px}.copy{float:right;background:#fff;color:var(--accent);border:1px solid #ddd6fe;padding:5px 8px;font-size:12px}.item{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0}.check input{margin-top:4px}.metric{font-size:28px;font-weight:900}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{background:#f4f2fa;color:var(--ink)}.tabs button.active{background:var(--accent);color:#fff}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:12px}.success{color:var(--good)}@media(max-width:800px){.span8,.span6,.span4{grid-column:span 12}.app{padding:12px}.top{align-items:flex-start}.brand h1{font-size:19px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">P</div><div><h1>PinPilot</h1><p>Pinterest Affiliate Content Assistant</p></div></div><button class="secondary" id="exportBtn">Export data</button></header><nav class="nav" id="nav"></nav><section id="view"></section></main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=JSON.parse(localStorage.getItem('pinpilotDB')||'{"products":[],"boards":[],"drafts":[],"results":[],"ideas":[]}');const save=()=>localStorage.setItem('pinpilotDB',JSON.stringify(db));let page='dashboard';
const navItems=[['dashboard','Dashboard'],['ideas','Idea generator'],['product','Create a pin'],['boards','Board tools'],['planner','Seasonal planner'],['checklist','Quality checker'],['results','Results tracker']];
function nav(){ $('#nav').innerHTML=navItems.map(([id,t])=>`<button class="${page===id?'active':''}" data-page="${id}">${t}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()}) }
function layout(html){nav();$('#view').innerHTML=html;wire()}
function copyText(t){navigator.clipboard?.writeText(t);alert('Copied.')}function block(title,text){return `<div class="output"><button class="copy" data-copy="${esc(text).replace(/"/g,'&quot;')}">Copy</button><h4>${title}</h4><div>${esc(text).replace(/\n/g,'<br>')}</div></div>`}
function dashboard(){layout(`<div class="grid"><div class="card span8"><div class="h"><div><h2>Welcome to PinPilot</h2><p class="muted">Create useful, disclosure-ready Pinterest content without connecting Amazon.</p></div><span class="pill">Free local workspace</span></div><div class="row" style="margin-top:16px"><button data-go="ideas">Find product ideas</button><button class="secondary" data-go="product">Create a pin package</button><button class="secondary" data-go="planner">Plan seasonal content</button></div><div class="notice" style="margin-top:16px"><b>Affiliate reminder:</b> Use clear disclosure near affiliate content and follow Amazon Associates and Pinterest rules. You supply and verify your own affiliate link.</div></div><div class="card span4"><h3>Your workspace</h3><div class="row"><div><div class="metric">${db.products.length}</div><div class="muted small">Products</div></div><div><div class="metric">${db.drafts.length}</div><div class="muted small">Drafts</div></div><div><div class="metric">${db.results.length}</div><div class="muted small">Logged pins</div></div></div></div><div class="card span12"><h3>Recent drafts</h3>${db.drafts.slice(-4).reverse().map(d=>`<div class="item"><b>${esc(d.title)}</b><div class="muted small">${esc(d.product)} · ${esc(d.angle)}</div></div>`).join('')||'<p class="muted">No drafts yet. Start with Create a pin.</p>'}</div></div>`)}
function ideas(){layout(`<div class="grid"><div class="card span4"><h2>Idea generator</h2><p class="muted small">No questions required. Choose a category—or use the big idea mix—to get lots of board names, product ideas, and pin angles.</p><div class="field"><label>Category</label><select id="ideaCategory"><option value="all">Everything</option><option>Home organization</option><option>Kitchen finds</option><option>Beauty and self-care</option><option>Gift ideas</option><option>Parenting</option><option>Pet products</option><option>Travel essentials</option><option>Budget-friendly finds</option><option>Seasonal ideas</option></select></div><button id="makeIdeas">Give me lots of ideas</button></div><div class="card span8"><h2>Board names, products & pin angles</h2><div id="ideaOut" class="muted">Tap “Give me lots of ideas.”</div></div></div>`)}
function generateIdeas(){let c=$('#ideaCategory').value;let sets={"Home organization":["Small Space Organization","Decluttering Finds That Work","Pretty Storage Solutions","Renter-Friendly Organization"],"Kitchen finds":["Kitchen Finds Worth Buying","Small Kitchen Upgrades","Meal Prep Helpers","Cook Smarter Finds"],"Beauty and self-care":["Self-Care Finds","Beauty Tools Worth Trying","At-Home Spa Ideas","Easy Morning Routine Finds"],"Gift ideas":["Gifts They’ll Actually Use","Thoughtful Gifts Under $50","Cozy Gift Ideas","Last-Minute Gift Finds"],"Parenting":["Busy Parent Must-Haves","Helpful Finds for New Parents","Kids’ Activity Finds","Family Organization Ideas"],"Pet products":["Pet Parent Favorites","Useful Dog Finds","Cat Products Worth Trying","Pet Home Organization"],"Travel essentials":["Travel Essentials Worth Packing","Carry-On Organization","Road Trip Finds","Travel Comfort Must-Haves"],"Budget-friendly finds":["Affordable Finds That Feel Expensive","Smart Buys Under $25","Budget Home Upgrades","Practical Products Worth It"],"Seasonal ideas":["Back-to-School Finds","Holiday Gift Guides","Fresh Start Organization","Seasonal Home Projects"]};let cats=c==='all'?Object.keys(sets):[c];let rows=cats.flatMap(cat=>sets[cat].map((board,i)=>({cat,board,products:["space-saving organizer","easy upgrade","giftable essential","before-and-after helper","budget-friendly must-have"][i],angle:["benefit-first","problem/solution","gift guide","before-and-after","budget-friendly"][i],score:90-i*5})));let html=rows.map(x=>`<div class="item"><div class="h"><b>${esc(x.board)}</b><span class="score">${x.score}/100 intent</span></div><p class="small"><b>Search Amazon:</b> ${esc(x.cat+' '+x.products)}<br><b>Pin angle:</b> ${esc(x.angle)}<br><b>More pin ideas:</b> ${esc(x.board+' ideas')}, ${esc(x.products+' checklist')}, ${esc(x.products+' gift guide')}</p><button class="secondary small" data-useidea="${esc(x.cat+' '+x.products)}">Use this product idea</button></div>`).join('');$('#ideaOut').innerHTML=html;$('#ideaOut').querySelectorAll('[data-useidea]').forEach(b=>b.onclick=()=>{page='product';render({product:b.dataset.useidea})})}
function product(data={}){layout(`<div class="grid"><div class="card span4"><h2>Create a pin</h2><p class="muted small">Answer two quick audience questions first so the copy has a real buyer in mind.</p><div class="field"><label>Product name</label><input id="pname" value="${esc(data.product||'')}" placeholder="e.g. 6-piece kitchen drawer organizer"></div><div class="field"><label>Amazon affiliate link</label><input id="plink" placeholder="Paste your affiliate link"></div><div class="field"><label>Who is buying?</label><select id="buyer"><option>Parent</option><option>Renter</option><option>Gift-giver</option><option>Busy professional</option><option>Home organizer</option><option>Pet owner</option><option>Other</option></select></div><div class="field"><label>What problem or desire matters most?</label><input id="pain" placeholder="less clutter, easier mornings, thoughtful gift"></div><div class="field"><label>Angle / tone</label><select id="angle"><option>Benefit-first</option><option>Question-led</option><option>Gift guide</option><option>Before-and-after</option><option>Budget-friendly</option><option>Premium / aesthetic</option></select></div><button id="generate">Generate 2 pin variants</button><p class="muted small">This local generator works without an API key. Claude can be connected later through the secure backend.</p></div><div class="card span8"><h2>Pin packages</h2><div id="pinOut" class="muted">Your two complete variants will appear here.</div></div></div>`)}
function makePackage(name,buyer,pain,angle,variant){let benefit=pain||'make everyday life easier';let hook=variant===1?`${name}: ${benefit} made easier`:`Is this the ${name} that ${benefit}?`;let desc=`Designed for ${buyer.toLowerCase()}s who want ${benefit}. Explore this ${name.toLowerCase()} and see whether it fits your routine. Save this idea for later and check the product details before buying.\n\nAs an Amazon Associate I earn from qualifying purchases. #ad`;let brief=`Use a vertical 2:3 Pinterest image. Show ${name.toLowerCase()} in a clean, realistic lifestyle scene for ${buyer.toLowerCase()}s. Make the benefit visible through the setting: ${benefit}. Leave the upper third or left side uncluttered for readable text. Use natural light, strong contrast, and one clear focal product. Avoid tiny text, crowded props, fake claims, logos, and misleading before/after results.`;let overlays=variant===1?[hook,`A simpler way to ${benefit}`,`${name}: worth a look?`,`Small change. Big everyday benefit.`]:[`For ${buyer.toLowerCase()}s: ${name}`,`Save this ${benefit} idea`,`A smart find for your routine`,`Make room for what matters.`];return {title:hook,description:desc,keywords:`${name}, ${buyer}, ${benefit}, home ideas, shopping finds, gift ideas, product recommendations, Pinterest inspiration`,disclosure:'As an Amazon Associate I earn from qualifying purchases. #ad',angle:variant===1?angle:'Question-led',brief,overlays}}
function renderPackages(){let n=$('#pname').value.trim(),l=$('#plink').value.trim(),b=$('#buyer').value,p=$('#pain').value,a=$('#angle').value;if(!n)return alert('Enter a product name.');let packs=[makePackage(n,b,p,a,1),makePackage(n,b,p,a,2)];db.products.push({name:n,link:l,buyer:b,pain:p,created:new Date().toISOString()});packs.forEach((x,i)=>db.drafts.push({product:n,title:x.title,description:x.description,angle:x.angle,brief:x.brief,created:new Date().toISOString()}));save();$('#pinOut').innerHTML=packs.map((x,i)=>`<div class="item"><div class="h"><h3>Variant ${i+1}: ${esc(x.angle)}</h3><span class="pill">A/B test</span></div>${block('Pinterest title',x.title)}${block('Description + disclosure',x.description)}${block('Keywords / tags',x.keywords)}${block('Pin Image Brief',x.brief)}${block('Overlay text options',x.overlays.join('\n'))}<div class="row"><button class="secondary" data-savevariant="${i}">Save variant</button></div></div>`).join('')}
function boards(){layout(`<div class="grid"><div class="card span4"><h2>Board tools</h2><div class="field"><label>Board name</label><input id="bname" placeholder="Small Space Solutions"></div><div class="field"><label>Audience / purpose</label><input id="bpurpose" placeholder="renter-friendly organization ideas"></div><button id="makeBoard">Create board description</button><hr><h3>Refine an idea</h3><div class="field"><label>Existing idea</label><textarea id="refine" placeholder="Paste an idea you already have"></textarea></div><button class="secondary" id="refineBtn">Refine / expand</button></div><div class="card span8"><h2>Board output</h2><div id="boardOut" class="muted">Create a board or refine an existing idea.</div></div></div>`)}
function planner(){let seasons=['January decluttering','Valentine’s Day gifts','Spring cleaning','Mother’s Day gifts','Graduation gifts','Back-to-school setup','Fall home refresh','Holiday gift guides','New Year home projects'];layout(`<div class="grid"><div class="card span4"><h2>Seasonal planner</h2><p class="muted small">Use timely angles without claiming live trend data.</p><div class="field"><label>Choose a seasonal angle</label><select id="season">${seasons.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Product or niche</label><input id="seasonProduct" placeholder="kitchen organization"></div><button id="makeSeason">Create content angles</button></div><div class="card span8"><h2>Content angles</h2><div id="seasonOut" class="muted">Choose a season to generate timely prompts.</div></div></div>`)}
function checklist(){let items=['Product is accurately represented','Pinterest title is clear and benefit-focused','Description explains the use case','Relevant keywords are included','Affiliate link is correct and tested','Affiliate disclosure is visible near the recommendation','Image is vertical and readable on mobile','Text overlay is easy to read','CTA is present but not misleading','Pin points to the relevant destination'];layout(`<div class="card"><h2>Pin quality checker</h2><p class="muted small">Check every item before publishing.</p><div id="checks">${items.map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}"> <span>${x}</span></label>`).join('')}</div><div class="h"><b id="checkScore">0 / ${items.length} complete</b><button class="secondary" id="resetChecks">Reset</button></div></div>`)}
function results(){layout(`<div class="grid"><div class="card span4"><h2>Log results</h2><div class="field"><label>Pin / product</label><input id="rname"></div><div class="field"><label>Title style</label><select id="rstyle"><option>Benefit-first</option><option>Question-led</option><option>Gift guide</option><option>Before-and-after</option><option>Budget-friendly</option><option>Premium / aesthetic</option></select></div>${['impressions','saves','outbound','purchases'].map(k=>`<div class="field"><label>${k}</label><input id="r${k}" type="number" min="0" value="0"></div>`).join('')}<button id="logResult">Log performance</button></div><div class="card span8"><h2>Performance history</h2><table class="table"><thead><tr><th>Pin</th><th>Style</th><th>Saves</th><th>Outbound</th><th>Purchases</th></tr></thead><tbody>${db.results.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.style)}</td><td>${r.saves}</td><td>${r.outbound}</td><td>${r.purchases}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No results logged yet.</td></tr>'}</tbody></table></div></div>`)}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));if(page==='ideas')$('#makeIdeas')?.addEventListener('click',generateIdeas);if(page==='product')$('#generate')?.addEventListener('click',renderPackages);if(page==='boards'){ $('#makeBoard')?.addEventListener('click',()=>{let n=$('#bname').value.trim()||'My board',p=$('#bpurpose').value.trim()||'helpful product ideas';let d=`Discover ${p}, practical finds, and inspiration for ${n.toLowerCase()}. Save ideas, compare products, and explore recommendations. As an Amazon Associate I earn from qualifying purchases. #ad`;db.boards.push({name:n,description:d});save();$('#boardOut').innerHTML=block('Board description',d)});$('#refineBtn')?.addEventListener('click',()=>{let x=$('#refine').value.trim();$('#boardOut').innerHTML=block('Refined idea',`Original idea: ${x}\n\nExpanded angle: Show the problem, the product solution, who benefits, one proof point to look for, and a clear next step. Create two pin variants: benefit-first and question-led.`)})}if(page==='planner')$('#makeSeason')?.addEventListener('click',()=>{let s=$('#season').value,p=$('#seasonProduct').value||'your product';let angles=[`Problem/solution: ${p} for ${s.toLowerCase()}`,`Gift or checklist angle: what to look for when choosing ${p}`,`Before-and-after angle: show the improvement without exaggerated claims`,`Quick tips carousel: 3 ways ${p} supports this seasonal need`];$('#seasonOut').innerHTML=angles.map(a=>`<div class="item">${esc(a)}</div>`).join('')+block('Suggested overlay',`${s}: ${p}`)});if(page==='checklist'){let update=()=>{$('#checkScore').textContent=`${document.querySelectorAll('[data-check]:checked').length} / 10 complete`};document.querySelectorAll('[data-check]').forEach(c=>c.onchange=update);$('#resetChecks').onclick=()=>{document.querySelectorAll('[data-check]').forEach(c=>c.checked=false);update()}}if(page==='results')$('#logResult')?.addEventListener('click',()=>{db.results.push({name:$('#rname').value||'Unnamed pin',style:$('#rstyle').value,impressions:+$('#rimpressions').value,saves:+$('#rsaves').value,outbound:+$('#routbound').value,purchases:+$('#rpurchases').value});save();render()})}
function render(data){if(page==='dashboard')dashboard();if(page==='ideas')ideas();if(page==='product')product(data);if(page==='boards')boards();if(page==='planner')planner();if(page==='checklist')checklist();if(page==='results')results()}
$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pinpilot-backup.json';a.click()};render();
</script></body></html>
